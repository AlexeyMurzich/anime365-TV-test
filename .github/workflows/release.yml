name: Release

# Тег vX.Y.Z на main — подписанные APK под каждую архитектуру в GitHub Releases (docs/release.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Вся история с тегами: версия сборки — git describe, «что нового» — сообщение тега.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Нет секрета SIGNING_KEYSTORE_BASE64 (docs/release.md)"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # Без SENTRY_DSN сборка не отправляет отчётов; без SENTRY_AUTH_TOKEN mapping.txt не уходит в Sentry.
      - name: Build
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: ./gradlew assembleProdRelease

      # Имя APK — то, по которому проверка обновлений выбирает файл: anime365-1.2.0-arm64-v8a.apk.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          for apk in app/build/outputs/apk/prod/release/app-prod-*-release.apk; do
            abi=$(basename "$apk" | sed -E 's/^app-prod-(.+)-release\.apk$/\1/')
            cp "$apk" "dist/anime365-${TAG#v}-$abi.apk"
          done
          git tag -l --format='%(contents)' "$TAG" > notes.md
          gh release create "$TAG" dist/*.apk --title "$TAG" --notes-file notes.md --verify-tag
