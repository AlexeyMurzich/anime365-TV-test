name: Baseline Profile

# Снимает профиль на эмуляторе: на телефоне без root это можно только с Android 13 (docs/release.md).
# Профиль — артефакт запуска; его коммитят в app/src/main/generated/baselineProfiles.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate
        run: ./gradlew :app:generateBaselineProfile -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: baseline-profile
          path: |
            app/src/main/generated/baselineProfiles/
            baselineprofile/build/outputs/
