name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Заодно проверяет gradle-wrapper.jar на подмену.
      - uses: gradle/actions/setup-gradle@v6

      # Тесты против живого API здесь не запускаются: Токена в CI нет и не будет (ADR 0005).
      - name: Check
        run: ./gradlew spotlessCheck detekt lint test buildHealth assembleDevDebug --continue

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
